name: Deploy Hugo Site to Azure Static Web Apps

on:
  push:
    branches: [ '**' ] # trigger on all branches

env:
  WORKING_DIRECTORY: './hugo-site'
  HUGO_VERSION:  0.161.1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: true
        fetch-depth: 0

      # Setup Hugo (install Hugo and dependencies)
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{env.HUGO_VERSION}}

      # Build Hugo site
    - name: Build Hugo site
      run: hugo --minify  # Use --minify for production builds
      working-directory: src

    # - name: Build Hugo site
    #   run: |
    #     echo "Building Hugo site..."
    #     cd ${{ env.WORKING_DIRECTORY }}
    #     hugo --minify --baseURL "${{ secrets.BASE_URL }}"

    - name: Deploy to Azure Static Web Apps
      if: github.ref == 'refs/heads/main'
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e. PR comments)
        action: 'upload'
        ###### Repository/Build Configurations - These values can be configured to match you app requirements. ######
        # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig        
        app_location: src # App source code path
        output_location: "public" # Built app content directory - optional
        skip_api_build: true
      env:
        HUGO_VERSION: ${{env.HUGO_VERSION}}