name: Deploy Hugo Site to Azure Static Web Apps

on:
  push:
    branches: [ main ]

env:
  WORKING_DIRECTORY: './hugo-site'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: true
        fetch-depth: 0

    # - name: Set up Hugo
    #   run: |
    #     echo "Setting up Hugo..."
    #     curl -LO https://github.com/gohugoio/hugo/releases/download/v0.58.0/hugo_0.58.0_Linux-64bit.deb
    #     sudo dpkg -i hugo_0.58.0_Linux-64bit.deb
        
    # - name: Build Hugo site
    #   run: |
    #     echo "Building Hugo site..."
    #     cd ${{ env.WORKING_DIRECTORY }}
    #     hugo --minify --baseURL "${{ secrets.BASE_URL }}"

    - name: Deploy to Azure Static Web Apps
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e. PR comments)
        action: 'upload'
        ###### Repository/Build Configurations - These values can be configured to match you app requirements. ######
        # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig        
        app_location: src # App source code path
        output_location: "public" # Built app content directory - optional
        skip_api_build: true