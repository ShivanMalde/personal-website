{{- .Store.Set "column-index" 0 -}}
{{- $noop := .Inner -}}

{{- $cols := .Get "cols" | default "2" -}}
{{- $gap := .Get "gap" | default "1rem" -}}
{{- $class := .Get "class" | default "" -}}

<div class="columns-container {{ $class }}" style="display: grid; grid-template-columns: repeat({{ $cols }}, 1fr); gap: {{ $gap }}; width: 100%;">
  {{- range .Store.Get "columns" -}}
    <div class="column" style="width: 100%;">
      {{ . }}
    </div>
  {{- end -}}
</div>
