baseURL = 'https://shivanmalde.com/'
languageCode = 'en-gb'
title = 'Shivan Malde | DevOps Manager and Platform Engineer'
theme = 'hugo-profile'
enableRobotsTXT = true

[module]
    [[module.imports]]
        path = 'github.com/gurusabarish/hugo-profile'

[Menus]
[[Menus.main]]
identifier = "about"
name = "About"
title = "About Me"
url = "/about"
weight = 1

[[Menus.main]]
identifier = "services"
name = "Services"
title = "Consulting Services"
url = "/services"
weight = 2

[params]
title = 'Shivan Malde | DevOps Manager and Platform Engineer'
description = 'My Website'
mathjax = false
animate = true
socialShare = false
staticPath = ""

custom_css = ["css/custom.css"]

  [params.color]
  primaryColor = "#6366f1"
  secondaryColor = "#f8fafc"
  textColor = "#1e293b"
  secondaryTextColor = "#64748b"
  textLinkColor = "#6366f1"
  backgroundColor = "#ffffff"
  secondaryBackgroundColor = "#f1f5f9"

  [params.color.darkmode]
  primaryColor = "#818cf8"
  secondaryColor = "#1e293b"
  textColor = "#f1f5f9"
  secondaryTextColor = "#94a3b8"
  textLinkColor = "#818cf8"
  backgroundColor = "#0f172a"
  secondaryBackgroundColor = "#1e293b"

  [params.font]
  fontSize = "1rem"
  fontWeight = "400"
  lineHeight = "1.7"
  textAlign = "left"


  [params.navbar]
  align = "ms-auto"
  brandName = "Shivan Malde"
  disableSearch = false
  enableSeparator = false

    [params.navbar.stickyNavBar]
    enable = true
    showOnScrollUp = true

    [params.navbar.menus]
    disableAbout = false
    disableExperience = false
    disableEducation = false
    disableProjects = false
    disableAchievements = false
    disableContact = false

  [params.hero]
  enable = true
  intro = "Hi, my name is"
  title = "Shivan."
  subtitle = "DevOps & Platform Engineer"
  content = "London-based DevOps manager and platform engineer with a proven track record of delivering scalable and reliable infrastructure solutions. Specialized in Kubernetes, Infrastructure as Code, and enterprise-scale CI/CD."
  image = "img/pro_portrait.jpg"

    [params.hero.bottomImage]
    enable = true

    [params.hero.button]
    enable = true
    name = "Resume"
    url = "/about"
    newPage = false
    download = false

    [[params.hero.socialLinks.fontAwesomeIcons]]
    icon = "fab fa-github"
    url = "https://github.com/ShivanMalde"

    [[params.hero.socialLinks.fontAwesomeIcons]]
    icon = "fab fa-linkedin"
    url = "https://www.linkedin.com/in/shivanmalde/"

  [params.singlePages]
  socialShare = false

    [params.singlePages.readTime]
    enable = false
    content = "min read"

    [params.singlePages.scrollprogress]
    enable = true

    [params.singlePages.tags]
    openInNewTab = true

  [params.datesFormat]
  article = " "
  articleList = "2 Jan 2006"
  articleRecent = "2 Jan 2006"
