baseURL = 'https://shivanmalde.com/'
languageCode = 'en-gb'
title = 'Shivan Malde | DevOps Manager and Platform Engineer'
theme = 'hugo-profile'
enableRobotsTXT = true

[module]
    [[module.imports]]
        path = 'github.com/gurusabarish/hugo-profile'

[Menus]
[[Menus.main]]
identifier = "about"
name = "About"
title = "About Me"
url = "/about"
weight = 1

[params]
title = 'Shivan Malde | DevOps Manager and Platform Engineer'
description = 'My Website'
mathjax = false
animate = true
socialShare = false
staticPath = ""

custom_css = ["css/custom.css"]


  [params.navbar]
  align = "ms-auto"
  brandName = "Hugo Profile"
  disableSearch = false
  enableSeparator = false

    [params.navbar.stickyNavBar]
    enable = true
    showOnScrollUp = true

    [params.navbar.menus]
    disableAbout = false
    disableExperience = false
    disableEducation = false
    disableProjects = false
    disableAchievements = false
    disableContact = false

  [params.hero]
  enable = true
  intro = "Hi, my name is"
  title = "Shivan."
  subtitle = "DevOps & Platform Engineer"
  content = "London-based DevOps manager and platform engineer with a proven track record of delivering scalable and reliable infrastructure solutions."
  image = "img/pro_portrait.jpg"

    [params.hero.bottomImage]
    enable = true

    [params.hero.button]
    enable = true
    name = "Resume"
    url = "/about"
    newPage = false
    download = false

    [[params.hero.socialLinks.fontAwesomeIcons]]
    icon = "fab fa-github"
    url = "https://github.com/ShivanMalde"

    [[params.hero.socialLinks.fontAwesomeIcons]]
    icon = "fab fa-linkedin"
    url = "https://www.linkedin.com/in/shivanmalde/"

  [params.singlePages]
  socialShare = false

    [params.singlePages.readTime]
    enable = false
    content = "min read"

    [params.singlePages.scrollprogress]
    enable = true

    [params.singlePages.tags]
    openInNewTab = true

  [params.datesFormat]
  article = " "
  articleList = "2 Jan 2006"
  articleRecent = "2 Jan 2006"
